<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  width="512"
  height="512"
>
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1689F5"/>
      <stop offset="50%" stop-color="#3454F5"/>
      <stop offset="100%" stop-color="#7428E8"/>
    </linearGradient>

    <!-- MP4 footer -->
    <linearGradient id="mp4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1168D5"/>
      <stop offset="100%" stop-color="#0755B8"/>
    </linearGradient>

    <!-- GIF footer -->
    <linearGradient id="gif" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#873BEF"/>
      <stop offset="100%" stop-color="#6520D8"/>
    </linearGradient>

    <!-- Subtle shadow -->
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow
        dx="0"
        dy="8"
        stdDeviation="8"
        flood-color="#10104A"
        flood-opacity="0.25"
      />
    </filter>

    <!-- Rounded background -->
    <clipPath id="rounded">
      <rect x="24" y="24" width="464" height="464" rx="72"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect
    x="24"
    y="24"
    width="464"
    height="464"
    rx="72"
    fill="url(#bg)"
  />

  <!-- Content -->
  <g filter="url(#shadow)">

    <!-- ================= MP4 FILE ================= -->

    <!-- File body -->
    <path
      d="
        M72 128
        Q72 112 88 112
        H178
        L216 150
        V320
        H72
        Z
      "
      fill="#FFFFFF"
    />

    <!-- Folded corner -->
    <path
      d="
        M178 112
        V136
        Q178 150 192 150
        H216
        Z
      "
      fill="#B7C9F2"
    />

    <!-- Play button -->
    <path
      d="
        M116 184
        Q116 172 128 178
        L174 204
        Q184 210 174 216
        L128 242
        Q116 248 116 236
        Z
      "
      fill="#155FD0"
    />

    <!-- MP4 label -->
    <path
      d="
        M72 320
        H216
        V366
        Q216 382 200 382
        H88
        Q72 382 72 366
        Z
      "
      fill="url(#mp4)"
    />

    <!-- MP4 text -->
    <text
      x="144"
      y="354"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="31"
      font-weight="800"
      letter-spacing="1"
      fill="#FFFFFF"
    >
      MP4
    </text>


    <!-- ================= ARROW ================= -->

    <path
      d="
        M230 247
        H275
        L261 233
        Q255 227 261 221
        Q267 215 273 221
        L299 247
        Q305 253 299 259
        L273 285
        Q267 291 261 285
        Q255 279 261 273
        L275 259
        H230
        Q221 259 221 253
        Q221 247 230 247
        Z
      "
      fill="#FFFFFF"
    />


    <!-- ================= GIF FILE ================= -->

    <!-- File body -->
    <path
      d="
        M296 128
        Q296 112 312 112
        H402
        L440 150
        V320
        H296
        Z
      "
      fill="#FFFFFF"
    />

    <!-- Folded corner -->
    <path
      d="
        M402 112
        V136
        Q402 150 416 150
        H440
        Z
      "
      fill="#CBB8F4"
    />

    <!-- Sun -->
    <circle
      cx="335"
      cy="173"
      r="14"
      fill="#FFBE2E"
    />

    <!-- Mountains -->
    <path
      d="
        M306 267
        L343 222
        Q350 214 357 222
        L382 250
        L397 230
        Q404 221 411 230
        L440 267
        Z
      "
      fill="#7740E9"
    />

    <!-- Secondary mountain -->
    <path
      d="
        M306 267
        L340 235
        L365 267
        Z
      "
      fill="#9857EF"
    />

    <!-- GIF label -->
    <path
      d="
        M296 320
        H440
        V366
        Q440 382 424 382
        H312
        Q296 382 296 366
        Z
      "
      fill="url(#gif)"
    />

    <!-- GIF text -->
    <text
      x="368"
      y="354"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="31"
      font-weight="800"
      letter-spacing="1"
      fill="#FFFFFF"
    >
      GIF
    </text>

  </g>
</svg>